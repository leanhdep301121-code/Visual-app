name: Swin
options:
  bundleIdPrefix: com.swin
  deploymentTarget:
    iOS: "17.0"
  # 源语言=简体中文（现有文案即中文源）；英文经 Localizable.xcstrings 提供。
  # 英文环境设备匹配 en.lproj 显示英文，中文环境显示中文源。
  developmentLanguage: zh-Hans
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.swin.aicoach
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    INFOPLIST_KEY_NSCameraUsageDescription: "Swin needs camera access to capture your golf swing for on-device analysis."
    INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Swin saves swing recordings to your photo library."
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UIRequiredDeviceCapabilities: video-camera
    # 让 Documents/（含 kept/ 留存片段）在「文件」App 里直接可见 + 可在原处打开。
    # 方便实验台拍完直接在手机上看 / AirDrop，不用 Xcode 导容器。
    INFOPLIST_KEY_UIFileSharingEnabled: YES
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES

targets:
  Swin:
    type: application
    platform: iOS
    sources:
      - path: Swin
      - path: Models
        optional: true
        # 只打包已提交的两个模型（yolo11n-pose.mlpackage + PoseTCN_v3_1.mlpackage）。
        # 其余是本地未提交的旧/备用文件（被 .gitignore），排除掉，否则全新 clone
        # 会因 pbxproj 引用到缺失文件而编译失败。
        excludes:
          - "PoseTCN_v2.*"
          - "yolo11n-pose-golf.*"
          - "posetcn_v2_best.pt"
          - ".DS_Store"
      - path: Resources
        optional: true
        excludes:
          - "Secrets.plist.example"
          - "samples/**"
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only
        SWIFT_EMIT_LOC_STRINGS: YES   # 编译期把 Text("…")/String(localized:) 抽进 Localizable.xcstrings
